name: Deploy

# Deployment is a separate, explicitly authorized operation.
# Merging code or a Changesets version PR must not deploy production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      PASSKEY_ORIGIN: ${{ vars.PASSKEY_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
      - name: Ensure Docker is ready
        shell: bash
        timeout-minutes: 3
        run: |
          if ! docker info >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == "macOS" && "$(docker context show)" == "orbstack" ]]; then
              orbctl start
            fi
            for attempt in {1..24}; do
              if docker info >/dev/null 2>&1; then
                break
              fi
              sleep 5
            done
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is unavailable. Check the runner's Docker context and daemon."
            exit 1
          fi
          docker compose version
      - name: Build image
        shell: bash
        run: |
          : "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD secret}"
          : "${PASSKEY_ORIGIN:?set PASSKEY_ORIGIN repository variable}"
          docker compose build --pull
      - name: Start services
        shell: bash
        run: docker compose up --detach --no-build --wait --wait-timeout 120
