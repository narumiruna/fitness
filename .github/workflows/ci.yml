name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Unit and contract tests
        run: npm test
      - name: HTTP tests with disposable SQLite
        run: npm run test:api
      - name: Require a Changeset against main
        if: github.event_name == 'pull_request'
        id: changesets
        run: npm run check:changesets -- --base origin/main
      - name: Validate Changesets status
        if: github.event_name == 'pull_request'
        env:
          # A verified version PR has already consumed its release plan.
          CHANGESET_BASE: ${{ steps.changesets.outputs.version-pr == 'true' && 'HEAD' || 'origin/main' }}
        run: npm run changeset -- status --since="$CHANGESET_BASE"
      - name: Changesets status
        if: github.event_name == 'push'
        run: npm run changeset -- status

  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Require disposable PostgreSQL support
        run: docker info
      - run: npm run test:db-init
      - run: npm run test:training:sqlite
      - run: npm run test:training:postgres
      - run: npm run test:api:postgres

  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: docker info
      - name: Build a separate test image without publishing
        run: docker build --tag fitness-logging-test:local .
      - name: Isolated image startup, migration, asset, and logging smoke tests
        run: npm run test:logging:docker
